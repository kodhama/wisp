name: Claude Code Review

# An automatic Claude review on every PR — a second, independent lens beside
# whatever review the driving session already ran on itself.
#
# Ported from a sibling repo in this family that had already debugged it
# against live runs. Every `with:` key below is there because its absence was
# observed to break the review THERE, not because it looked sensible here. The
# comments record which failure each one answers, so a future edit that drops
# one knows what it is re-enabling.
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ IF YOU EDIT THIS FILE, THE REVIEW STOPS RUNNING — SILENTLY, AND GREEN.   │
# └──────────────────────────────────────────────────────────────────────────┘
#
# `claude-code-action` refuses to run unless this file is byte-identical to the
# copy on the DEFAULT branch (an injection defence). When it refuses it logs a
# warning, does nothing, and the job still concludes SUCCESS. So:
#
#   * a PR that touches this file gets no Claude review — the blind spot sits
#     exactly where mistakes are likeliest, since the file reviews itself out
#     of existence;
#   * merging a change here disables the review on EVERY open PR until each one
#     merges the default branch back in.
#
# That is instrumented rather than merely documented: `agent-workflow-parity.yml`
# fails loudly whenever a claude-code-action workflow differs from the default
# branch. It runs no agent, so it cannot itself skip green. The upstream lesson
# was that a point-of-use comment does NOT transfer between files — the same
# cause was written down in one workflow and then recurred in another, because
# the second reader never saw the first note. This paragraph is orientation;
# the parity job is the control.
#
# When `parity` goes red on your PR:
#
#   1. expect no Claude review on that PR — get a second opinion elsewhere
#      (Codex reviews it fine — this repo has a Codex reviewer configured);
#   2. after merging, `git merge origin/main` into every open PR branch, or
#      they stay unreviewed behind a green tick.
#
# ── Green here has never meant "clean" ────────────────────────────────────────
#
# The exit code tracks whether the action RAN, never what it FOUND. Nothing in
# this workflow can turn a finding into a red check. Upstream, five independent
# causes produced one identical symptom — success reported, nothing delivered:
#
#   | # | cause                                     | fixed by            |
#   |---|-------------------------------------------|---------------------|
#   | 1 | `pull-requests: read` — findings buffered  | permissions below   |
#   | 2 | weekly token quota exhausted (bailed)     | — (only loud one)   |
#   | 3 | output hidden; verdict unreadable         | show_full_output    |
#   | 4 | no `--comment`; terminal-only summary     | prompt              |
#   | 5 | Bash denied; could not post               | claude_args         |
#   | 6 | `Skill` denied; the review never ran      | claude_args         |
#   | 7 | `Agent` absent; delegation misfires        | claude_args         |
#   | 8 | one review per PR; later pushes skipped   | prompt (below)      |
#   | 9 | ends its turn awaiting background agents  | prompt (below)      |
#
# Cause 2 is the only one that ever went red, and only because it failed
# loudly. Treat silence from this job as UNRESOLVED, never as a pass — if you
# need to know what it thought, read the run log, not the check mark.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # Not inherited from either source: one has no cap, the sibling that does
    # uses 10. A wedged agent job otherwise burns the runner default (6h). 20
    # is a guess at "long enough for a large PR" and is the first thing to
    # raise if a real review is ever killed mid-flight — a timeout kill is red,
    # so it fails loudly rather than joining the list above.
    timeout-minutes: 20
    permissions:
      contents: read
      # write, not read — cause 1 above. With `read` the plugin buffers its
      # inline findings and silently fails to post them.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # `--comment` — cause 4. Without it the command only prints a
          # terminal summary and posts nothing.
          # The override below answers two more causes, both proved on
          # kodhama/stewards and rolled out here unchanged.
          #
          # Cause 8 (stewards#66) — the upstream skill's step 1 stops when the PR
          # "already has a code review from you from earlier", and step 7
          # re-checks it. That asks whether Claude has COMMENTED, never whether
          # it reviewed THIS COMMIT, so after one review every later push ships
          # unreviewed behind a green tick. The skill is upstream and cannot be
          # edited here; the prompt outranks it. On a push the event carries the
          # exact new range, so the review is scoped rather than repeated.
          #
          # Cause 9 (stewards#63) — the skill delegates every step to subagents,
          # and the model sometimes treats a dispatch as asynchronous and ends
          # its turn waiting. Correct in a session where a notification arrives;
          # fatal here, where the process exits with the turn. Four of nine
          # measured runs died this way, green, having delivered nothing.
          #
          # Verified on kodhama/stewards#103: a second review landed on a PR
          # that already had one, scoped to `ecdd6400..eecc706e`.
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            Override, and it applies to step 1 and to the step 7 re-check:
            criterion (d) — "already has a code review from you from earlier" —
            does NOT disqualify this run. This workflow fires once per push, and
            a commit pushed after an earlier review is the commit most worth
            reviewing. Proceed even though you have commented here before.

            Scope. If this run was triggered by a push to an existing pull
            request, review only the commits pushed in this event:
            ${{ github.event.before }}..${{ github.event.pull_request.head.sha }}
            Confine yourself to what changed in that range. On any other trigger
            — the pull request being opened, reopened, or marked ready — the
            range above is not meaningful; review the pull request as a whole.

            Either way: do not restate a finding your earlier comments already
            make. If an earlier finding is now fixed, say so in one line rather
            than repeating it, and if nothing in scope warrants a comment, do
            not comment.

            You are running headless in CI. Nothing will notify you when a
            delegated agent finishes, and this process exits when your turn
            ends. So do not end your turn waiting for anything: dispatch a
            subagent only where you will read its result in this same turn, and
            carry every step through to the comment yourself. "I'll continue
            once they complete" is a failed run — it reports success and
            delivers nothing.
          # Cause 3. Keeps the review's own verdict readable in the run log,
          # which is the only place a skipped or undelivered finding survives.
          show_full_output: true
          # Cause 5. Matched upstream to what a known-good run actually used —
          # Bash x16, Write x4, Read x2 — not guessed.
          #
          #   Bash  posts via `gh api ... --input`, and locates/quotes this
          #         repo's own rules with `find`/`grep` (which is most of this
          #         reviewer's value here — this repo's decisions and
          #         specs are the
          #         standard a change is judged against). Deliberately NOT
          #         scoped to `Bash(gh:*)`: that would cut the standards
          #         reading, and would not match the posting call anyway — a
          #         compound `cd … && for … gh api …`.
          #   Write stages one JSON payload per comment under /tmp.
          #   Read  CLAUDE.md and the artifacts it points at.
          #
          # This is NOT a sandbox, and omitting `Edit` is not hardening —
          # unrestricted Bash writes anywhere, and `Agent`/`ToolSearch` ran in
          # the reference run without appearing here, so the flag grants rather
          # than restricts. Read it as "what the job was handed". Real
          # confinement needs a different mechanism.
          # `Skill`, `Agent` and `ToolSearch` added 2026-08-02, after all three
          # were proved missing in kodhama/stewards — evidence on stewards#63.
          #
          #   Skill      loads `/code-review:code-review`, which IS the review.
          #              Without it the run records
          #              "permission_denials": [{"tool_name": "Skill", ...}]
          #              and the job concludes success having reviewed nothing.
          #   Agent      the review delegates its gate check to a subagent.
          #              Without it the model reaches for `TaskCreate` instead
          #              and the client rejects the call.
          #   ToolSearch named by that same error as the remedy for a tool
          #              schema that was never sent.
          #
          # The original three-tool list was matched to the tools a known-good
          # run was seen USING — which cannot see the tools it needed in order
          # to start. Verified on kodhama/stewards#93: with all three present
          # the reviewer posted a verdict for the first time.
          claude_args: |
            --allowedTools Bash,Read,Write,Skill,Agent,ToolSearch
          # https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # https://code.claude.com/docs/en/cli-reference
