name: Codex marketplace canary

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      marketplace_source:
        description: Marketplace Git source for the Preview smoke
        required: true
        type: string
      marketplace_ref:
        description: Marketplace Git ref for the Preview smoke
        required: true
        type: string

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Record and assert Node 24 runtime
        run: |
          node --version
          node scripts/node24-preflight.mjs
      - name: Install current stable Codex CLI
        id: install_codex
        continue-on-error: true
        run: npm install --global @openai/codex@latest
      - name: Run weekly canary
        id: weekly
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          CODEX_HOME: ${{ runner.temp }}/wisp-codex-home
          EVIDENCE_DIR: ${{ runner.temp }}/wisp-codex-evidence
          CANARY_CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          CODEX_INSTALL_OUTCOME: ${{ steps.install_codex.outcome }}
        run: >-
          node scripts/codex-canary.mjs
          --mode weekly
          --marketplace-source kodhama/stewards
          --marketplace-ref main
          --output "$EVIDENCE_DIR"
      - name: Run manual Preview smoke
        id: manual
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          CODEX_HOME: ${{ runner.temp }}/wisp-codex-home
          EVIDENCE_DIR: ${{ runner.temp }}/wisp-codex-evidence
          CANARY_CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          CODEX_INSTALL_OUTCOME: ${{ steps.install_codex.outcome }}
          CANARY_MARKETPLACE_SOURCE: ${{ inputs.marketplace_source }}
          CANARY_MARKETPLACE_REF: ${{ inputs.marketplace_ref }}
        run: >-
          node scripts/codex-canary.mjs
          --mode manual
          --marketplace-source "$CANARY_MARKETPLACE_SOURCE"
          --marketplace-ref "$CANARY_MARKETPLACE_REF"
          --output "$EVIDENCE_DIR"
      - name: Enforce weekly behavioral failures
        if: github.event_name == 'schedule' && steps.weekly.outcome == 'failure'
        run: exit 1
      - name: Enforce manual behavioral failures
        if: github.event_name == 'workflow_dispatch' && steps.manual.outcome == 'failure'
        run: exit 1
      - name: Upload private canary evidence
        if: >-
          always() &&
          (steps.weekly.outputs.artifact_ready == 'true' ||
          steps.manual.outputs.artifact_ready == 'true')
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/wisp-codex-evidence
        uses: actions/upload-artifact@v4
        with:
          name: codex-canary-${{ github.run_id }}
          path: |
            ${{ env.EVIDENCE_DIR }}/codex.jsonl
            ${{ env.EVIDENCE_DIR }}/evidence.json
          if-no-files-found: error
          retention-days: 30
